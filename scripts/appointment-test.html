<body>
  <h1>Проверка отправки формы Ariadent</h1>
  <p>Кнопка отправит одно письмо с вымышленными данными.</p>
  <form method="post" action="./appointment.php">
    <input type="hidden" name="name" value="Ariadent Test">
    <input type="hidden" name="phone" value="0000000000">
    <p><label>Ваш адрес для проверки Reply-To <input type="email" name="email" required></label></p>
    <input type="hidden" name="message" value="TEST - geen echte afspraak.">
    <input type="hidden" name="privacyConsent" value="1">
    <button type="submit">Отправить тестовое письмо</button>
  </form>
  <p>После отправки откроется ответ сервера. При <code>{"ok":true}</code> проверьте почтовый ящик получателя и папку «Спам».</p>
